    .wbs-row{display:grid;grid-template-columns:minmax(270px,1.35fr) minmax(520px,2.6fr) minmax(350px,1.75fr) 170px;min-height:88px;border-bottom:1px solid var(--line)}.wbs-row:last-child{border-bottom:0}.wbs-row>div{border-right:1px solid var(--line)}.wbs-row>div:last-child{border-right:0}
    .wbs-head{min-height:auto;background:#f7f9fb;color:var(--navy);font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase}.wbs-head>div:not(.schedule-head){display:flex;align-items:center;padding:12px 16px}

    .timeline-cell{position:relative;min-width:0;overflow:hidden}.timeline-cell.is-current:after{content:"";position:absolute;z-index:4;left:66.666%;top:0;bottom:0;width:1px;background:rgba(216,78,78,.78);pointer-events:none}.month-cells{position:absolute;inset:0}.month-cells span{min-height:100%;background:linear-gradient(180deg,rgba(245,247,249,.4),rgba(255,255,255,.1))}

  </style>
</head>

        var body=rows.map(function(t){var key=stateKey(t[7]),left=((t[3]-1)/12)*100,width=((t[4]-t[3]+1)/12)*100;return '<div class="wbs-row" role="row"><div class="task-cell" role="cell"><span class="task-id">'+esc(t[0])+'</span><div><strong>'+esc(t[1])+'</strong><small><span class="phase-chip">'+esc(t[9])+'</span>'+esc(t[6])+' · '+esc(t[2])+'</small></div></div><div class="timeline-cell '+(selectedYear===2026?'is-current':'')+'" role="cell"><div class="month-grid month-cells">'+Array.from({length:12},function(){return '<span></span>'}).join('')+'</div><div class="timeline-bar bar-'+key+'" style="left:'+left+'%;width:'+width+'%" title="'+esc(t[1]+': '+t[2])+'">'+esc(t[2])+'</div></div><div class="output-cell" role="cell"><span class="doc-icon">▤</span><div><strong>'+esc(t[5])+'</strong><small><b>확인 내용</b>'+esc(OUTPUT_DETAILS[t[0]]||'')+'</small></div></div><div class="progress-cell" role="cell"><div class="progress-top"><span class="status-badge status-'+key+'">'+esc(t[7])+'</span><b>'+t[8]+'%</b></div><span class="row-progress"><i style="width:'+t[8]+'%"></i></span></div></div>'}).join('');
        document.getElementById('wbsTable').innerHTML=head+(body||'<div class="empty-row">선택한 상태에 해당하는 업무가 없습니다.</div>');
        document.getElementById('rowCount').textContent=rows.length+'개 업무 표시';
      }
      function render(){document.getElementById('sectionKicker').textContent=selectedYear+' WBS';document.getElementById('sectionTitle').textContent=YEARS[selectedYear].title;renderNav();renderSummary();renderFocus();renderFilters();renderTable()}
      document.addEventListener('click',function(e){var y=e.target.closest('[data-year]'),f=e.target.closest('[data-filter]');if(y){selectedYear=Number(y.getAttribute('data-year'));selectedFilter='전체';render()}if(f){selectedFilter=f.getAttribute('data-filter');renderFilters();renderTable()}});
      render();
    })();
  </script>
</body>
</html>
