<script>
const links=[...document.querySelectorAll('nav a[data-src]')];
// 예전 공유 링크(#drf 등) → 잠금 문서 세트 안의 해당 문서
const REG='05_잠금문서/03_인허가_문서세트/index.html';
const alias={khidi:'00_KHIDI_컨설팅_상담신청서.html','khidi-1p':'00_KHIDI_컨설팅_제품소개_1페이지.html',
 drf:'01_DRF_개발의뢰서.html',mrs:'02_MRS_시장요구사항명세서.html',sdp:'03_SDP_소프트웨어개발계획서.html',
 rrs:'04_RRS_규제요구사항명세서.html',dmp:'05_DMP_LBL_데이터및레이블링계획서.html',rmp:'06_RMP_위험관리계획서.html',
 srs:'07_SRS_소프트웨어요구사항명세서.html',sap:'08_SAP_RTM_독립검증및추적계획.html',pcode:'261029_TB_제품코드_등급_적용검토_v2.html'};
function go(){
  const h=(location.hash||'#home').slice(1);
  let a=links.find(x=>x.getAttribute('href')==='#'+h), src;
  if(a) src=a.dataset.src;
  else if(alias[h]){a=links.find(x=>x.getAttribute('href')==='#reg');src=REG+'#'+alias[h];}
  else {a=links[0];src=a.dataset.src;}
  links.forEach(x=>x.removeAttribute('aria-current'));
  a.setAttribute('aria-current','page');
  const v=document.getElementById('view');
  if(v.getAttribute('src')!==src)v.src=src;
  document.title=a.firstChild.textContent.trim()+' · TB 공동연구';
}
addEventListener('hashchange',go);go();
</script>
